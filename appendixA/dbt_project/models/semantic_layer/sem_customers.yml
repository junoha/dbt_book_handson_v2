# 顧客セマンティックモデル（dim_customers ベース）
# 顧客ディメンションとして利用。measures は持たず、orders 側のメトリクスを顧客属性で切る際の軸を提供する。
# join は customer エンティティ（customer_id = fct_orders.customer_id）で解決される。
semantic_models:
  - name: customers
    description: |
      顧客ディメンション。1 行 = 1 顧客の最新情報。
      付録 A は SCD Type 2 を採用せず最新断面のみを保持するため、customer_id（ナチュラルキー）を
      primary entity として利用する。
      県・地域・会員ステータスなど、注文メトリクスを切り分けるための属性を提供する。
    model: ref('dim_customers')
    defaults:
      agg_time_dimension: registration_date

    entities:
      - name: customer
        type: primary
        expr: customer_id

    dimensions:
      - name: registration_date
        description: 会員登録日
        type: time
        type_params:
          time_granularity: day
      - name: prefecture
        description: 都道府県
        type: categorical
      - name: region
        description: 地方区分（関東・関西・中部 等）
        type: categorical
      - name: customer_status
        description: 会員ステータス（active / inactive 等）
        type: categorical
      - name: customer_tenure_segment
        description: 会員継続期間セグメント（new / existing / long_term 等）
        type: categorical
