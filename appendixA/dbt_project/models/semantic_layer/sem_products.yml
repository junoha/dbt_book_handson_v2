# 商品セマンティックモデル（dim_products ベース）
# 本付録の注文メトリクス（revenue / order_count）は fct_orders ベースのため
# 直接 join されないが、将来的に fct_order_items を組み合わせた分析に発展できるよう
# 商品側のディメンションを定義する。
#
# 注意: dim_products は時系列属性を持たないため measure は定義しない。
# 単価集計を行いたい場合は、時系列 fact（fct_order_items など）側に単価 measure を置くのが素直。
semantic_models:
  - name: products
    description: |
      商品ディメンション。1 行 = 1 商品の最新情報。
      付録 A は SCD Type 2 を採用せず最新断面のみを保持するため、product_id（ナチュラルキー）を
      primary entity として利用する。
      カテゴリ・仕入先・価格ティアなどの属性を提供する。
    model: ref('dim_products')

    entities:
      - name: product
        type: primary
        expr: product_id

    dimensions:
      - name: category_name
        description: 商品カテゴリ名
        type: categorical
      - name: supplier_name
        description: 仕入先名
        type: categorical
      - name: price_tier
        description: 価格ティア（low / medium / high / premium）
        type: categorical
      - name: product_status
        description: 商品ステータス（active / inactive / discontinued 等）
        type: categorical
