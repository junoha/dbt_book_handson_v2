version: 2

# 付録 A のセマンティックレイヤーは dim_* / fct_* をエンティティの primary / foreign として
# 参照する。セマンティックレイヤー利用時のテスト設計指針に沿い、次の 3 層を整備する:
# 1. Entity Integrity: primary key の unique / not_null、外部キーの not_null / relationships
# 2. Time dimension: time dimension（fct の order_date や dim_dates の date_day）は not_null
# 3. Measure の前提: measure の元となる数値カラムは not_null
#
# 付録 A は Semantic Layer の紹介に集中するため、第 4 章の SCD Type 2（dbt snapshot 経由）は採用せず、
# dim / fct は最新断面のみを保持する。そのため `valid_from` / `valid_to` / `is_current` /
# `customer_key` / `product_key` などのカラムとテストは定義しない。
models:
  # =========================================================
  # Dimensions
  # =========================================================
  - name: dim_customers
    description: |
      顧客ディメンション（最新断面のみ）。
      sem_customers.yml で primary entity `customer` の `expr: customer_id` として参照される。
    columns:
      - name: customer_id
        description: "顧客ID（ナチュラルキー、semantic layer の customer entity として利用）"
        data_tests:
          - not_null
          - unique
      - name: customer_name
        description: "顧客名"
        data_tests:
          - not_null
      - name: registration_date
        description: "会員登録日（semantic layer の time dimension）"
        data_tests:
          - not_null
      - name: prefecture
        description: "都道府県（semantic layer の categorical dimension）"
      - name: region
        description: "地方区分（semantic layer の categorical dimension）"
      - name: customer_status
        description: "会員ステータス（semantic layer の categorical dimension）"
      - name: customer_tenure_segment
        description: "会員継続期間セグメント（semantic layer の categorical dimension）"

  - name: dim_products
    description: |
      商品ディメンション（最新断面のみ）。
      staging の products / categories / suppliers を結合し、最新属性をフラットに持つ。
      sem_products.yml で primary entity `product` の `expr: product_id` として参照される。
    columns:
      - name: product_id
        description: "商品ID（ナチュラルキー、semantic layer の product entity として利用）"
        data_tests:
          - not_null
          - unique
      - name: product_name
        description: "商品名"
        data_tests:
          - not_null
      - name: category_name
        description: "商品カテゴリ名（semantic layer の categorical dimension）"
      - name: supplier_name
        description: "仕入先名（semantic layer の categorical dimension）"
      - name: price_tier
        description: "価格帯区分（semantic layer の categorical dimension）"
      - name: product_status
        description: "商品ステータス（semantic layer の categorical dimension）"
      - name: unit_price
        description: "商品単価"
        data_tests:
          - not_null

  - name: dim_dates
    description: |
      ### Grain
      1 row per date_day（dbt_project.yml の vars.start_date 〜 vars.end_date）

      ### Business process
      日付ディメンション。dbt_utils.date_spine マクロで日付系列を生成し、
      年月日・四半期・曜日・平日休日フラグ・会計年度（4 月始まり）などの
      属性を付与する。fct_orders / fct_order_items が date_key で結合する共通ディメンション。

      ### MetricFlow time spine としての役割
      `time_spine.standard_granularity_column: date_day` を宣言することで、
      MetricFlow の `metric_time__day` / `metric_time__month` などの時間軸が
      自動的に利用可能になる。`date_day` カラムには `granularity: day` を付与し、
      最小粒度を明示する。

      ### SCD Type 2 との関係
      日付という概念は時間とともに変化しないため、SCD Type 2 の対象外。
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_key
        description: "日付サロゲートキー（date_day そのまま、ファクトの date_key と結合）"
        data_tests:
          - not_null
          - unique
      - name: date_day
        description: "日付。MetricFlow の standard_granularity_column（day 粒度）。date_key と同じ値のため not_null / unique テストは date_key 側に集約"
        granularity: day
      - name: year
        description: "年"
      - name: month
        description: "月（1〜12）"
      - name: day
        description: "月内日（1〜31）"
      - name: quarter
        description: "四半期（暦上の 1〜4）"
      - name: day_of_week
        description: "曜日番号（0=日曜 〜 6=土曜、PostgreSQL の extract(dow) と同じ）"
      - name: day_of_year
        description: "1 月 1 日からの通算日（1〜366）"
      - name: week_of_year
        description: "ISO 週番号（1〜53）"
      - name: day_name
        description: "曜日名の日本語表記（日曜日 〜 土曜日）"
      - name: month_name
        description: "月名の日本語表記（1月 〜 12月）"
      - name: quarter_name
        description: "暦上の四半期名（Q1 〜 Q4）"
      - name: weekday_flag
        description: "平日・休日区分（平日 / 休日）"
      - name: is_month_start
        description: "月初フラグ（その月の 1 日のとき true）"
      - name: is_month_end
        description: "月末フラグ（その月の最終日のとき true）"
      - name: fiscal_year
        description: "会計年度（4 月始まり、4〜12 月は当年、1〜3 月は前年扱い）"
      - name: fiscal_quarter
        description: "会計年度の四半期（1: 4〜6 月 / 2: 7〜9 月 / 3: 10〜12 月 / 4: 1〜3 月）"

  # =========================================================
  # Facts
  # =========================================================
  - name: fct_orders
    description: |
      注文ヘッダー fact。1 行 = 1 注文。
      sem_orders.yml で primary entity `order` / foreign entity `customer` の基点となる。
    columns:
      - name: order_id
        description: "注文ID。semantic layer の order entity (primary) として利用"
        data_tests:
          - not_null
          - unique
      - name: customer_id
        description: |
          顧客ID（ナチュラルキー）。Semantic layer の customer entity (foreign) として利用。
          dim_customers.customer_id (primary entity) と同名・同型 (bigint) に揃えることで、
          MetricFlow が `customer__prefecture` などのディメンションを指定したクエリで
          fct_orders ⋈ dim_customers の JOIN を自動構築できる（公式の primary ↔ foreign パターン）。
          本付録は最新断面のみで SCD Type 2 を採用しないため、ナチュラルキー 1 つだけで結合キーとして機能する。
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: date_key
        description: "日付 FK（dim_dates.date_key と対応）"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_dates')
                field: date_key
      - name: order_date
        description: "注文日。semantic layer の time dimension（agg_time_dimension）として利用"
        data_tests:
          - not_null
      - name: total_amount
        description: "注文合計金額。semantic layer の measure `total_amount` の元データ"
        data_tests:
          - not_null
      - name: order_count
        description: "注文件数（常に 1）。semantic layer の measure `orders` の元データ"
        data_tests:
          - not_null
      - name: order_status
        description: "注文ステータス（categorical dimension）"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['pending', 'processing', 'shipped', 'delivered', 'cancelled', 'refunded']
      - name: order_size_segment
        description: "注文サイズセグメント（categorical dimension）"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['small', 'medium', 'large', 'extra_large']

  - name: fct_order_items
    description: |
      注文明細 fact。1 行 = 1 明細。
      本付録の sem_orders.yml からは直接参照していないが、将来的に商品粒度の
      メトリクスを Semantic Layer で扱う場合の入力となる。
    columns:
      - name: order_item_id
        description: "注文明細ID"
        data_tests:
          - not_null
          - unique
      - name: order_id
        description: "注文ID（fct_orders への FK）"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id
      - name: product_id
        description: "商品ID（dim_products.product_id への FK）"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id
      - name: order_date
        description: "注文日"
        data_tests:
          - not_null
      - name: quantity
        description: "数量"
        data_tests:
          - not_null
      - name: unit_price
        description: "単価"
        data_tests:
          - not_null
      - name: line_total
        description: "明細合計"
        data_tests:
          - not_null
