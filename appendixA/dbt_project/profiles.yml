dbt_book_apdx_data_modeling_project:
  target: dev
  outputs:
    dev:
      type: duckdb
      # DuckDB のデータベースファイル。カタログ名はファイル名から決まるため、
      # ソース定義の database: dbt_demo と一致するように dbt_demo.duckdb とする。
      # （zakka_mall.duckdb にするとカタログ名とスキーマ名が衝突してエラーになる）
      path: dbt_demo.duckdb
      schema: analytics
      threads: 4
      # NOTE: mf（MetricFlow）は Python 版の dbt-duckdb でこの profiles.yml を読む。
      # dbt-core は既定で ~/.dbt を見るため、mf 実行時は DBT_PROFILES_DIR=. を指定する。
