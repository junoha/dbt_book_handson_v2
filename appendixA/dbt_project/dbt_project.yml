name: 'zakkamall_analytics'
version: '1.0.0'
config-version: 2

profile: 'dbt_book_apdx_data_modeling_project'

flags:
  # generic test の引数を arguments: プロパティから読む挙動を有効にする。
  # dbt v2 では behavior change flag のオプトアウトができないため、明示的に true にしておく。
  require_generic_test_arguments_property: true

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"
  - "dbt_internal_packages"
  - "logs"

# 付録 A はディメンショナルモデル（最新断面のみ）の上に Semantic Layer を載せる構成に限定する。
# 第 4 章のような intermediate 層・SCD Type 2（dbt snapshot）・集計マートは採用しない。
models:
  zakkamall_analytics:
    # 静的解析のレベル。baseline は v2 の既定値で、検出結果はすべて警告になる。
    # strict にするとカラム単位の型解決とカラムレベルリネージが有効になるが、dbt login が必要。
    +static_analysis: baseline

    staging:
      +materialized: view
      +schema: staging
      +docs:
        node_color: "#F7931E"

    dimensional:
      +materialized: table
      +schema: dimensional
      +docs:
        node_color: "#4CAF50"

vars:
  # dim_dates の date_spine 範囲
  start_date: '2020-01-01'
  end_date: '2030-12-31'

  # 分析の基準日。顧客の継続期間セグメント（customer_tenure_segment）をこの日を起点に判定する。
  # 別の時点で分析したい場合は dbt run --vars '{analysis_as_of_date: 2025-06-30}' で上書きできる。
  analysis_as_of_date: '2024-12-31'
