jaffle_shop_iceberg:
  target: dev
  outputs:
    dev:
      type: athena
      region_name: ap-northeast-1
      database: awsdatacatalog
      schema: jaffle_shop_iceberg
      s3_staging_dir: "s3://{{ env_var('CH7_S3_BUCKET_NAME') }}/athena-results/"
      s3_data_dir: "s3://{{ env_var('CH7_S3_BUCKET_NAME') }}/dbt-tables/"
      s3_data_naming: schema_table_unique
      work_group: "{{ env_var('ATHENA_WORKGROUP') }}"
