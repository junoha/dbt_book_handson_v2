version: 2

unit_tests:
  # dim_customers の LTV がキャンセル・返金注文を除外することを担保する Unit Test。
  # E-1 で修正した customer_payments CTE の order_status フィルタが、以後のリファクタで
  # 落ちても Unit Test で即検知できるようにする（Retrospective アプローチ）。
  - name: test_dim_customers_ltv_excludes_cancelled_orders
    model: dim_customers
    description: |
      顧客生涯価値（customer_lifetime_value）にキャンセル注文・返金注文の支払いが算入されないことを検証する。
      キャンセル/返金された注文は total_orders / total_amount / customer_lifetime_value のいずれにも含まれない。
    config:
      tags: ["unit_test", "marts"]
    overrides:
      macros:
        # ref('stg_zakka_mall__customers') 側の age 計算で使われる book_current_date を固定する
        book_current_date: "CAST('2025-10-01' as date)"
    given:
      - input: ref('stg_zakka_mall__customers')
        format: dict
        rows:
          - {
              customer_id: 1,
              customer_name: "田中太郎",
              email: "tanaka@example.com",
              phone: "090-1234-5678",
              status: "active",
              registration_date: "2023-01-01",
              birth_date: "1990-01-01",
              age: 35,
              created_at: "2023-01-01 10:00:00",
              updated_at: "2023-01-01 10:00:00",
            }
      - input: ref('stg_zakka_mall__orders')
        format: dict
        rows:
          # 完了注文: LTV に含まれる
          - {
              order_id: 101,
              customer_id: 1,
              order_status: "delivered",
              order_date: "2024-01-15",
              total_amount: 10000,
              shipping_fee: 500,
              tax_amount: 1000,
              created_at: "2024-01-15 10:00:00",
              updated_at: "2024-01-15 10:00:00",
            }
          # キャンセル注文: LTV から除外されるべき
          - {
              order_id: 102,
              customer_id: 1,
              order_status: "cancelled",
              order_date: "2024-02-10",
              total_amount: 5000,
              shipping_fee: 500,
              tax_amount: 500,
              created_at: "2024-02-10 10:00:00",
              updated_at: "2024-02-10 10:00:00",
            }
          # 返金済み注文: LTV から除外されるべき
          - {
              order_id: 103,
              customer_id: 1,
              order_status: "refunded",
              order_date: "2024-03-05",
              total_amount: 8000,
              shipping_fee: 500,
              tax_amount: 800,
              created_at: "2024-03-05 10:00:00",
              updated_at: "2024-03-05 10:00:00",
            }
      - input: ref('stg_zakka_mall__payments')
        format: dict
        rows:
          # 全注文とも「支払い完了」として記録されているが、
          # customer_payments CTE 側でキャンセル/返金注文は order_status で除外される想定
          - {
              payment_id: 201,
              order_id: 101,
              payment_date: "2024-01-15",
              payment_amount: 10000,
              payment_status: "completed",
              payment_method: "credit_card",
              created_at: "2024-01-15 11:00:00",
              updated_at: "2024-01-15 11:00:00",
            }
          - {
              payment_id: 202,
              order_id: 102,
              payment_date: "2024-02-10",
              payment_amount: 5000,
              payment_status: "completed",
              payment_method: "credit_card",
              created_at: "2024-02-10 11:00:00",
              updated_at: "2024-02-10 11:00:00",
            }
          - {
              payment_id: 203,
              order_id: 103,
              payment_date: "2024-03-05",
              payment_amount: 8000,
              payment_status: "completed",
              payment_method: "credit_card",
              created_at: "2024-03-05 11:00:00",
              updated_at: "2024-03-05 11:00:00",
            }
    expect:
      format: dict
      rows:
        - {
            customer_id: 1,
            customer_name: "田中太郎",
            email: "tanaka@example.com",
            phone: "090-1234-5678",
            registration_date: "2023-01-01",
            status: "active",
            birth_date: "1990-01-01",
            age: 35,
            first_order_date: "2024-01-15",
            last_order_date: "2024-01-15",
            total_orders: 1,
            total_amount: "10000.00",
            avg_order_amount: "10000.00",
            customer_lifetime_value: "10000.00",
          }

  # dim_products の total_profit が「販売時点の単価 (od.unit_price) - 現時点の原価 (p.cost)」で
  # 計算されることを担保する Unit Test。商品マスタの現時点価格 (p.price) で売上が再計算される
  # 注: cost 側は現時点の値を使うため、商品マスタの cost が変更されると
  # 過去の販売分の total_profit も巻き戻る点はデータモデルの仕様。
  - name: test_dim_products_total_profit_uses_sale_price
    model: dim_products
    description: |
      total_profit が販売時点の単価（order_details.unit_price）と現時点の原価（products.cost）から
      計算されることを検証する。
      - 売上側: 商品マスタの現時点価格（products.price）が変更されても、過去の販売分の total_profit は
        unit_price 側で固定されているため巻き戻らない。
      - 原価側: 商品マスタの cost を変えると過去の販売分も再計算されて巻き戻る点に留意（仕様）。
    config:
      tags: ["unit_test", "marts"]
    given:
      - input: ref('stg_zakka_mall__products')
        format: dict
        rows:
          # 現時点の販売価格 1500 円（過去 1000 円から値上げした想定）、原価 600 円、利益率 60%
          - {
              product_id: 1,
              product_name: "テスト商品A",
              category_id: 1,
              price: 1500,
              cost: 600,
              stock_quantity: 20,
              is_active: true,
              profit_margin: "60.00",
              created_at: "2023-01-01 10:00:00",
              updated_at: "2024-06-01 10:00:00",
            }
      - input: ref('stg_zakka_mall__product_categories')
        format: dict
        rows:
          - {
              category_id: 1,
              category_name: "キッチン用品",
              parent_category_id: null,
              created_at: "2023-01-01 10:00:00",
              updated_at: "2023-01-01 10:00:00",
            }
      - input: ref('stg_zakka_mall__order_details')
        format: dict
        rows:
          # 値上げ前に unit_price = 1000 円で 2 個販売（line_total = 2000 円）
          - {
              order_detail_id: 301,
              order_id: 101,
              product_id: 1,
              quantity: 2,
              unit_price: 1000,
              line_total: 2000,
              created_at: "2024-01-15 10:00:00",
            }
      - input: ref('stg_zakka_mall__orders')
        format: dict
        rows:
          - {
              order_id: 101,
              customer_id: 1,
              order_status: "delivered",
              order_date: "2024-01-15",
              total_amount: 2000,
              shipping_fee: 500,
              tax_amount: 200,
              created_at: "2024-01-15 10:00:00",
              updated_at: "2024-01-15 10:00:00",
            }
    expect:
      format: dict
      rows:
        - {
            product_id: 1,
            product_name: "テスト商品A",
            category_name: "キッチン用品",
            price: 1500,
            cost: 600,
            profit_margin: "60.00",
            stock_quantity: 20,
            is_active: true,
            total_sold_quantity: 2,
            total_revenue: "2000.00",
            total_orders: 1,
            # 販売時点単価ベース: (1000 - 600) * 2 = 800 円
            # 現時点価格ベースだと (1500 - 600) * 2 = 1800 円 になってしまい、NG
            total_profit: "800.00",
          }
