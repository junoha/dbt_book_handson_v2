dbt_book_ch5_data_quality_project:
  target: dev
  outputs:
    dev:
      type: duckdb
      # DuckDB はファイル名がカタログ名になる。ソース定義が dbt_demo を指しているため
      # ファイル名は dbt_demo.duckdb にしている。
      path: dbt_demo.duckdb
      schema: analytics
      threads: 4

    prod:
      type: duckdb
      path: "{{ env_var('DBT_DUCKDB_PATH', 'dbt_demo.duckdb') }}"
      schema: "{{ env_var('DBT_SCHEMA', 'analytics') }}"
      threads: 4

# Elementary（edr）用のプロファイル。
# edr は自身の内部 dbt プロジェクト（site-packages 配下）を --project-dir にして dbt を呼ぶため、
# path を相対パスにすると別の場所に空のデータベースを作ってしまう。絶対パスを環境変数で渡す。
#   export CH5_DUCKDB_PATH="$(pwd)/dbt_demo.duckdb"
elementary:
  outputs:
    default:
      type: duckdb
      path: "{{ env_var('CH5_DUCKDB_PATH', 'dbt_demo.duckdb') }}"
      schema: analytics_elementary
      threads: 4
