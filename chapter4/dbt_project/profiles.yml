dbt_book_ch4_data_modeling_project:
  target: dev
  outputs:
    dev:
      type: duckdb
      # DuckDB のデータベースファイル。カタログ名はファイル名から決まるため、
      # ソース定義の database: dbt_demo と一致するように dbt_demo.duckdb とする。
      # （zakka_mall.duckdb にするとカタログ名とスキーマ名が衝突してエラーになる）
      path: dbt_demo.duckdb
      schema: analytics
      threads: 4
      # NOTE: dbt 2.0.4 の DuckDB アダプタは settings（TimeZone など）を適用しないため、
      # セッションのタイムゾーンに依存する変換はモデル側で at time zone 'UTC' を明示している。
      # 例: base_dim_customers / base_dim_products の updated_at
