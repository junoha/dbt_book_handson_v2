name: 'zakkamall_analytics'
version: '1.0.0'
config-version: 2

profile: 'dbt_book_ch4_data_modeling_project'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"
  - "dbt_internal_packages"
  - "logs"

models:
  zakkamall_analytics:
    staging:
      +materialized: view
      +schema: staging
      +docs:
        node_color: "#F7931E"

    intermediate:
      +materialized: ephemeral
      +docs:
        node_color: "#9C27B0"

    marts:
      +materialized: table
      +docs:
        node_color: "#2196F3"
      core:
        +schema: marts_core
        +docs:
          node_color: "#4CAF50"
      sales:
        +schema: marts_sales
      marketing:
        +schema: marts_marketing
      operations:
        +schema: marts_operations

seeds: {}

snapshots:
  zakkamall_analytics:
    +schema: snapshots
    +docs:
      node_color: "#FF5722"

vars:
  # dim_dates の date_spine 範囲（本章で使用）
  start_date: '2020-01-01'
  end_date: '2030-12-31'

  # 分析の基準日。RFM 分析や商品ライフサイクルの「最終購買からの経過日数」を
  # この日を起点に数える。current_date を使うと実行日によって結果が変わるため、
  # サンプルデータの分析結果を安定させるために基準日を明示している。
  # 別の時点で分析したい場合は dbt run --vars '{analysis_as_of_date: 2025-01-31}' で上書きできる。
  analysis_as_of_date: '2024-12-31'

  # ビジネスしきい値
  high_value_customer_threshold: 100000